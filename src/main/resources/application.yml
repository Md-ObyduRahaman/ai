server:
  port: 8090

spring:
  application:
    name: claudePractice

  # MySQL Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/shopeasy
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true