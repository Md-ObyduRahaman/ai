<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'E-Commerce Store'">E-Commerce Store</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header th:replace="fragments :: header"></header>

    <section class="bg-primary text-white text-center py-5 mb-5">
        <div class="container">
            <h1 class="display-4 fw-bold" th:text="${heroTitle ?: 'Welcome to Our Store'}">Welcome to Our Store</h1>
            <p class="lead mb-4" th:text="${heroSubtitle ?: 'Discover amazing products at unbeatable prices!'}">Discover amazing products at unbeatable prices!</p>
            <a th:href="@{/products}" class="btn btn-light btn-lg px-4">Shop Now</a>
        </div>
    </section>

    <section class="py-5">
        <div class="container">
            <h2 class="text-center mb-5" th:text="${featuredTitle ?: 'Featured Products'}">Featured Products</h2>
            <div class="row g-4">
                <div class="col-md-4" th:each="product : ${products}">
                    <div class="card h-100">
                        <img th:src="${product.imageUrl}" class="card-img-top" alt="Product image" style="height: 200px; object-fit: contain; padding: 1rem; background: #f8f9fa;">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title" th:text="${product.name}">Product Name</h5>
                            <p class="card-text text-muted" th:text="${product.description}">Description</p>
                            <div class="mt-auto">
                                <span class="h5 text-primary" th:text="${'$' + #numbers.formatDecimal(product.price, 1, 2)}">$99.99</span>
                                <form sec:authorize="isAuthenticated()" th:action="@{/cart/add}" method="post" class="d-inline">
                                    <input type="hidden" name="name" th:value="${product.name}">
                                    <input type="hidden" name="imageUrl" th:value="${product.imageUrl}">
                                    <input type="hidden" name="price" th:value="${product.price}">
                                    <button type="submit" class="btn btn-outline-primary ms-2">Add to Cart</button>
                                </form>
                                <a sec:authorize="isAnonymous()" href="/login" class="btn btn-outline-secondary ms-2">Login to Buy</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="bg-light py-5 mb-5">
        <div class="container">
            <div class="row text-center">
                <div class="col-md-4 mb-4">
                    <i class="bi bi-truck fs-1 text-primary mb-3"></i>
                    <h4>Free Shipping</h4>
                    <p>Free shipping on orders over $50</p>
                </div>
                <div class="col-md-4 mb-4">
                    <i class="bi bi-shield-lock fs-1 text-primary mb-3"></i>
                    <h4>Secure Payment</h4>
                    <p>100% secure payment processing</p>
                </div>
                <div class="col-md-4 mb-4">
                    <i class="bi bi-arrow-counterclockwise fs-1 text-primary mb-3"></i>
                    <h4>Easy Returns</h4>
                    <p>30-day money-back guarantee</p>
                </div>
            </div>
        </div>
    </section>

    <footer th:replace="fragments :: footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.js"></script>
</body>
</html>
