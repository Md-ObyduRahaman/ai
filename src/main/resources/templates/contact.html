<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'Contact Us'">Contact Us</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header th:replace="fragments :: header"></header>

    <section class="py-5">
        <div class="container">
            <h1 class="mb-4">Contact Us</h1>
            <div class="row g-5">
                <div class="col-md-6">
                    <form th:action="@{/contact}" method="post">
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="subject" class="form-label">Subject</label>
                            <input type="text" class="form-control" id="subject" name="subject" required>
                        </div>
                        <div class="mb-3">
                            <label for="message" class="form-label">Message</label>
                            <textarea class="form-control" id="message" name="message" rows="5" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary px-4">Send Message</button>
                    </form>
                </div>
                <div class="col-md-6">
                    <h4 class="mb-3">Get in Touch</h4>
                    <div class="d-flex align-items-start mb-3">
                        <i class="bi bi-geo-alt fs-5 text-primary me-3 mt-1"></i>
                        <div>
                            <strong>Address</strong><br>
                            123 Commerce Street, Suite 100<br>
                            New York, NY 10001
                        </div>
                    </div>
                    <div class="d-flex align-items-start mb-3">
                        <i class="bi bi-telephone fs-5 text-primary me-3 mt-1"></i>
                        <div>
                            <strong>Phone</strong><br>
                            +1 (555) 123-4567
                        </div>
                    </div>
                    <div class="d-flex align-items-start mb-3">
                        <i class="bi bi-envelope fs-5 text-primary me-3 mt-1"></i>
                        <div>
                            <strong>Email</strong><br>
                            support@shopeasy.com
                        </div>
                    </div>
                    <div class="d-flex align-items-start">
                        <i class="bi bi-clock fs-5 text-primary me-3 mt-1"></i>
                        <div>
                            <strong>Business Hours</strong><br>
                            Mon - Fri: 9:00 AM - 6:00 PM<br>
                            Sat: 10:00 AM - 4:00 PM<br>
                            Sun: Closed
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer th:replace="fragments :: footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.js"></script>
</body>
</html>
