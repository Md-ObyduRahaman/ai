<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'Products'">Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header th:replace="fragments :: header"></header>

    <section class="py-5">
        <div class="container">
            <h1 class="mb-4" th:text="${pageTitle ?: 'All Products'}">All Products</h1>
            <div class="row g-4">
                <div class="col-md-3" th:each="product : ${products}">
                    <div class="card h-100 product-card">
                        <img th:src="${product.imageUrl}" class="product-img-sm" alt="Product image">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title" th:text="${product.name}">Product Name</h5>
                            <p class="card-text text-muted small" th:text="${product.description}">Description</p>
                            <div class="mt-auto">
                                <span class="h5 text-primary" th:text="${'$' + #numbers.formatDecimal(product.price, 1, 2)}">$99.99</span>
                                <form sec:authorize="isAuthenticated()" th:action="@{/cart/add}" method="post" class="d-inline">
                                    <input type="hidden" name="name" th:value="${product.name}">
                                    <input type="hidden" name="imageUrl" th:value="${product.imageUrl}">
                                    <input type="hidden" name="price" th:value="${product.price}">
                                    <button type="submit" class="btn btn-outline-primary btn-sm ms-2">Add to Cart</button>
                                </form>
                                <a sec:authorize="isAnonymous()" href="/login" class="btn btn-outline-secondary btn-sm ms-2">Login to Buy</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer th:replace="fragments :: footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
