<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'Cart'">Cart</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header th:replace="fragments :: header"></header>

    <section class="py-5">
        <div class="container">
            <h1 class="mb-4">Shopping Cart</h1>
            <div th:if="${#lists.isEmpty(cartItems)}" class="text-center py-5">
                <i class="bi bi-cart4 fs-1 text-muted d-block mb-3"></i>
                <p class="lead text-muted">Your cart is empty.</p>
                <a href="/products" class="btn btn-primary">Continue Shopping</a>
            </div>
            <div th:if="${!#lists.isEmpty(cartItems)}">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 80px"></th>
                                <th>Product</th>
                                <th class="text-center" style="width: 150px">Quantity</th>
                                <th class="text-end" style="width: 120px">Price</th>
                                <th class="text-end" style="width: 120px">Total</th>
                                <th style="width: 60px"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${cartItems}">
                                <td>
                                    <img th:src="${item.imageUrl}" alt="" style="width: 60px; height: 60px; object-fit: contain;">
                                </td>
                                <td><span th:text="${item.name}">Product</span></td>
                                <td class="text-center">
                                    <form th:action="@{/cart/update}" method="post" class="d-inline-flex align-items-center gap-2">
                                        <input type="hidden" name="name" th:value="${item.name}">
                                        <input type="number" name="quantity" th:value="${item.quantity}" min="0" class="form-control form-control-sm" style="width: 70px">
                                        <button type="submit" class="btn btn-sm btn-outline-secondary">Update</button>
                                    </form>
                                </td>
                                <td class="text-end" th:text="${'$' + #numbers.formatDecimal(item.price, 1, 2)}">$0.00</td>
                                <td class="text-end" th:text="${'$' + #numbers.formatDecimal(item.total, 1, 2)}">$0.00</td>
                                <td class="text-center">
                                    <form th:action="@{/cart/remove}" method="post">
                                        <input type="hidden" name="name" th:value="${item.name}">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">&times;</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr class="table-light fw-bold">
                                <td colspan="4" class="text-end">Total:</td>
                                <td class="text-end" th:text="${'$' + #numbers.formatDecimal(cartTotal, 1, 2)}">$0.00</td>
                                <td></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
                <div class="d-flex justify-content-between mt-4">
                    <a href="/products" class="btn btn-outline-primary">Continue Shopping</a>
                    <button class="btn btn-success" onclick="alert('Checkout not implemented in this demo.')">Checkout</button>
                </div>
            </div>
        </div>
    </section>

    <footer th:replace="fragments :: footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
